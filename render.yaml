# render.yaml
# One-click deploy config for Render.com
# Push this to GitHub → connect repo on render.com → it auto-deploys

services:
  - type: web
    name: hospital-opd-analyzer
    env: python
    buildCommand: "pip install -r requirements.txt && python generate_sample_data.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
